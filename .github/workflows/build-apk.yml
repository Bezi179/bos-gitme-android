name: Build BOS GITME Premium APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Premium ZIP
        run: |
          mkdir premium
          unzip -o BOS-GITME-Premium-Android-v0.2.zip -d premium
          cp -r premium/. .

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare Android
        run: flutter create --platforms=android --project-name=bos_gitme .

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BOS-GITME-Premium-APK
          path: build/app/outputs/flutter-apk/app-release.apk
